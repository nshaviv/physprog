<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">Piecewise falling object and ground decision</title>
  <desc id="desc">A falling object approaches the ground while a height curve branches from free fall to a bounded ground state.</desc>
  <defs>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="13" result="noise"/>
      <feColorMatrix in="noise" values="1 0 0 0 0.12  0 1 0 0 0.20  0 0 1 0 0.23  0 0 0 .12 0"/>
    </filter>
    <filter id="wash" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="29" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="20"/>
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <marker id="arrow-navy" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#243447"/>
    </marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#2a9d8f"/>
    </marker>
  </defs>

  <g id="background">
    <rect width="1600" height="650" fill="#f5f0e5"/>
    <rect width="1600" height="650" filter="url(#paper)" opacity=".92"/>
    <g filter="url(#wash)" opacity=".62">
      <ellipse cx="330" cy="245" rx="330" ry="250" fill="#e9c46a" opacity=".31"/>
      <ellipse cx="1110" cy="260" rx="430" ry="260" fill="#2a9d8f" opacity=".24"/>
      <ellipse cx="1340" cy="500" rx="300" ry="150" fill="#e76f51" opacity=".22"/>
    </g>
  </g>

  <g id="falling-object" stroke-linecap="round">
    <path d="M150 530 Q380 493 660 520" fill="none" stroke="#243447" stroke-width="8"/>
    <path d="M130 548 Q380 510 690 540" fill="none" stroke="#d89a20" stroke-width="16" opacity=".42"/>
    <path d="M390 92 C385 205 401 333 500 498" fill="none" stroke="#243447" stroke-width="4" stroke-dasharray="10 16" opacity=".48"/>
    <path d="M394 111 V185" fill="none" stroke="#243447" stroke-width="7" marker-end="url(#arrow-navy)"/>
    <circle cx="390" cy="112" r="34" fill="#e9c46a" stroke="#243447" stroke-width="6" opacity=".42"/>
    <circle cx="399" cy="230" r="36" fill="#e9c46a" stroke="#243447" stroke-width="6" opacity=".58"/>
    <circle cx="427" cy="355" r="40" fill="#e76f51" stroke="#243447" stroke-width="6" opacity=".76"/>
    <ellipse cx="500" cy="517" rx="66" ry="15" fill="#243447" opacity=".17" filter="url(#shadow)"/>
    <circle cx="500" cy="489" r="47" fill="#c14953" stroke="#243447" stroke-width="7"/>
    <path d="M344 520 H562" fill="none" stroke="#2a9d8f" stroke-width="8"/>
  </g>

  <g id="decision" transform="translate(710 274)">
    <path d="M0 51 L64 0 L128 51 L64 102 Z" fill="#fffaf0" stroke="#243447" stroke-width="6"/>
    <circle cx="48" cy="51" r="9" fill="#243447"/>
    <path d="M57 51 L91 27" stroke="#2a9d8f" stroke-width="8" stroke-linecap="round"/>
    <path d="M57 51 L91 75" stroke="#c14953" stroke-width="8" stroke-linecap="round"/>
    <path d="M128 51 H200" fill="none" stroke="#243447" stroke-width="6" marker-end="url(#arrow-navy)"/>
  </g>

  <g id="piecewise-graph" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M940 528 H1490" stroke="#243447" stroke-width="6" marker-end="url(#arrow-navy)"/>
    <path d="M972 558 V92" stroke="#243447" stroke-width="6" marker-end="url(#arrow-navy)"/>
    <path d="M973 139 C1115 173 1214 280 1305 528" stroke="#c14953" stroke-width="12"/>
    <path d="M1305 528 C1360 570 1412 602 1475 622" stroke="#c14953" stroke-width="6" stroke-dasharray="13 15" opacity=".55"/>
    <path d="M1305 528 H1470" stroke="#2a9d8f" stroke-width="13" marker-end="url(#arrow-teal)"/>
    <circle cx="1305" cy="528" r="25" fill="#e9c46a" stroke="#243447" stroke-width="6"/>
    <path d="M1290 512 L1320 542 M1320 512 L1290 542" stroke="#c14953" stroke-width="7"/>
    <path d="M1080 518 V538 M1190 518 V538 M1415 518 V538" stroke="#243447" stroke-width="3" opacity=".62"/>
    <path d="M962 420 H982 M962 310 H982 M962 200 H982" stroke="#243447" stroke-width="3" opacity=".62"/>
  </g>
</svg>
